name: Bug report
description: The strip, the panel or a count looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The collector's output names your repositories, their
        folders and your commit subjects. Do not paste it as is: reproduce with a
        small test repository (`--root /path/to/test`) or replace the names first.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [The bar strip, The history panel, The settings menu, A count or date]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      placeholder: "A commit I made at 23:50 shows on the next day."
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Collector output (redacted)
      description: |
        `~/.config/omarchy/plugins/io.github.lizindev.commit-tracker/bin/commit-tracker --pretty`,
        ideally run with `--root` on a test repository that shows the problem.
      render: json
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`omarchy version`, the plugin version from its manifest.json, and `git --version`"
      placeholder: "Omarchy 4.0.5, Commit Tracker 1.2.0, git 2.56.0"
    validations:
      required: true
